{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container narrow">
  <div class="auth-card center">
    <h1 class="page-title">{{ title }}</h1>
    <p>{{ message }}</p>
    {% if action_url %}<a class="btn btn--primary" href="{{ action_url }}">{{ action_label }}</a>{% endif %}
  </div>
</div>
{% endblock %}
