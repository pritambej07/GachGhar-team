{% extends "base.html" %}
{% block title %}Search products{% endblock %}
{% block content %}
<div class="container">
  <h1 class="page-title">Search products</h1>
  <form method="get" action="{% url 'store:search' %}">
    <input type="search" name="q" placeholder="Search plants, pots, seeds..." value="" maxlength="100">
    <button type="submit">Search</button>
  </form>
  <p class="muted">Enter at least 2 characters to search.</p>
</div>
{% endblock %}
